[project]
name = "video-rag-app"
version = "0.1.0"
description = "Find the exact moment in a video: multimodal retrieval over speech and frames, with word-accurate clips"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.12",
    "uvicorn>=0.34.0",
    "pydantic>=2.11.3",
    "pydantic-settings>=2.8.1",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.10",
    "opensearch-py>=3.0.0",
    "requests>=2.32.3",
    "httpx>=0.28.1",
    "redis>=5.2",
    "celery[redis]>=5.4",
    "boto3>=1.35",
    "faster-whisper>=1.1",
    "pillow>=11",
    "alembic>=1.14",
    "prometheus-client>=0.21",
    "langgraph>=0.6",
]
readme = "README.md"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "ruff>=0.11.5",
    "jupyter>=1.1.1",
]

[tool.ruff]
line-length = 130
exclude = [".venv/**", "src/app/**"]  # src/app is the legacy duplicate app, pending removal
src = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
