apiVersion: 1

datasources:
  - name: Prometheus
    uid: video-rag-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Postgres
    uid: video-rag-postgres
    type: grafana-postgresql-datasource
    url: postgres:5432
    user: video_rag
    jsonData:
      database: video_rag
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: $POSTGRES_PASSWORD  # from the container's environment
