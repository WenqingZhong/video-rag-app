# Scrapes the API's /metrics (request rates, latency, /ask results, cache hits).
# Tokens, cost and per-step timings are not here: Grafana reads them from Postgres (llm_calls, trace_spans).
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: video-rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
