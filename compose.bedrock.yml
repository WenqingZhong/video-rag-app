# Local stack with the models on Amazon Bedrock instead of Ollama, to evaluate Bedrock before deploying
# (make eval-bedrock). Uses your local AWS credentials, read-only.
#   docker compose -f compose.yml -f compose.bedrock.yml up -d api worker
x-bedrock: &bedrock
  LLM_PROVIDER: bedrock
  BEDROCK_REGION: ${BEDROCK_REGION:-us-east-1}
  BEDROCK_TEXT_MODEL_ID: ${BEDROCK_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
  BEDROCK_VISION_MODEL_ID: ${BEDROCK_MODEL:-us.anthropic.claude-haiku-4-5-20251001-v1:0}
  AWS_PROFILE: ${AWS_PROFILE:-default}

services:
  api:
    environment: *bedrock
    volumes: ["${HOME}/.aws:/root/.aws:ro"]
  worker:
    environment: *bedrock
    volumes: ["${HOME}/.aws:/root/.aws:ro"]
